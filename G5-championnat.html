<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%234f8cff%27/%3E%3Ctext x=%2732%27 y=%2742%27 font-size=%2728%27 font-family=%27sans-serif%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27white%27%3EG5%3C/text%3E%3C/svg%3E">
<title>G5 — Championnat des motards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#07080f;--g1:rgba(79,140,255,.18);--g2:rgba(139,92,246,.16);--glass:rgba(255,255,255,.06);--glass2:rgba(255,255,255,.1);--line:rgba(255,255,255,.13);--txt:#eef1ff;--mut:#8b93b5;--blue:#4f8cff;--vio:#8b5cf6;--em:#2ee6a6;--gold:#ffc83d;--red:#ff5470;--amb:#ffa84d;--hd:'Chakra Petch','Arial Narrow',sans-serif;--bd:'Outfit',system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px)}
[data-theme=light]{--bg:#eef1fa;--g1:rgba(79,140,255,.22);--g2:rgba(139,92,246,.14);--glass:rgba(255,255,255,.72);--glass2:rgba(255,255,255,.95);--line:rgba(20,30,70,.13);--txt:#14183a;--mut:#5b6290}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:var(--bd);background:var(--bg);color:var(--txt);min-height:100%;background-image:radial-gradient(900px 500px at 10% -10%,var(--g1),transparent),radial-gradient(800px 500px at 100% 10%,var(--g2),transparent);background-attachment:fixed}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3,.hd{font-family:var(--hd);letter-spacing:.2px}
.glass{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:18px}
small,.mut{color:var(--mut)}
/* outils : thème + état réseau */
.tools{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:80;display:flex;gap:8px;align-items:center}
.tbtn{border:1px solid var(--line);background:var(--glass2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:99px;padding:7px 14px;font-weight:600;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
/* buttons */
.btn{border:0;border-radius:11px;padding:10px 16px;font-weight:600;background:linear-gradient(135deg,var(--blue),var(--vio));color:#fff;transition:transform .12s,box-shadow .2s;text-decoration:none;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn:hover{box-shadow:0 0 22px rgba(79,140,255,.45)}.btn:active{transform:scale(.97)}
.btn.em{background:linear-gradient(135deg,#1fcf8f,#14a37a)}.btn.red{background:linear-gradient(135deg,#ff5470,#d0304f)}
.btn.ghost{background:var(--glass);border:1px solid var(--line);color:var(--txt)}.btn.sm{padding:6px 11px;font-size:12.5px}.btn.big{padding:15px 22px;font-size:16px;width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
input,select,textarea{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
[data-theme=light] input,[data-theme=light] select,[data-theme=light] textarea{background:rgba(255,255,255,.8)}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(79,140,255,.2)}
select option{color:#111}
label{font-size:12.5px;color:var(--mut);display:block;margin-bottom:5px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:600;border:1px solid var(--line);background:var(--glass)}
.b-em{color:var(--em);border-color:rgba(46,230,166,.45);background:rgba(46,230,166,.1)}.b-red{color:var(--red);border-color:rgba(255,84,112,.45);background:rgba(255,84,112,.1)}
.b-amb{color:var(--amb);border-color:rgba(255,168,77,.45);background:rgba(255,168,77,.1)}.b-blue{color:var(--blue);border-color:rgba(79,140,255,.5);background:rgba(79,140,255,.12)}
.b-gold{color:var(--gold);border-color:rgba(255,200,61,.5);background:rgba(255,200,61,.12)}.b-vio{color:#b79bff;border-color:rgba(139,92,246,.5);background:rgba(139,92,246,.12)}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lcard{width:min(420px,100%);padding:28px}
.lcard h1{font-size:28px;margin:10px 0 2px}.logo{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;font:700 22px var(--hd);background:linear-gradient(135deg,var(--blue),var(--vio));box-shadow:0 0 30px rgba(79,140,255,.5)}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:rgba(255,255,255,.05);margin:18px 0}.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;color:var(--mut);font-weight:600}.seg .on{background:var(--glass2);color:var(--txt)}
.fg{margin-bottom:13px}.err{color:var(--red);font-size:13px;min-height:18px;margin-bottom:6px}
/* shell */
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
#nav{position:sticky;top:0;height:100vh;padding:18px 12px;display:flex;flex-direction:column;gap:5px;border-right:1px solid var(--line);background:var(--glass);backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}.brand b{font:700 20px var(--hd);width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--vio))}
.ni{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid transparent;border-radius:11px;background:none;text-align:left;color:var(--mut);font-weight:500;position:relative}
.ni:hover{background:var(--glass)}.ni.on{color:var(--txt);background:var(--glass2);border-color:var(--line);box-shadow:inset 3px 0 0 var(--em)}
.ni em{margin-left:auto;background:var(--red);color:#fff;font-style:normal;font-size:11px;padding:1px 7px;border-radius:99px}.ni.out{margin-top:auto}
#view{padding:56px 24px 24px;min-width:0;max-width:1180px;width:100%;margin:0 auto}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}.ph h1{font-size:26px}.ph p{color:var(--mut);font-size:14px;margin-top:3px}
.card{padding:18px;margin-bottom:18px}.card h3{font-size:17px;margin-bottom:12px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.kpi{padding:16px}.kpi small{display:block;font-size:12.5px}.kpi .v{font:700 24px var(--hd);margin-top:4px}.kpi .s{font-size:12px;color:var(--mut);margin-top:3px}
.kpi.em .v{color:var(--em)}.kpi.amb .v{color:var(--amb)}.kpi.blue .v{color:var(--blue)}.kpi.gold .v{color:var(--gold)}
/* leaderboard */
.lbc{padding:18px 18px 8px;border-color:rgba(79,140,255,.35);box-shadow:0 0 40px rgba(79,140,255,.08)}
.lbh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}.lbh h2{font-size:21px}
.pills{display:flex;gap:6px;padding:4px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.pill{border:0;background:none;padding:8px 16px;border-radius:99px;color:var(--mut);font:600 13px var(--hd);letter-spacing:.8px;text-transform:uppercase}
.pill.on{background:linear-gradient(135deg,var(--blue),var(--vio));color:#fff;box-shadow:0 0 18px rgba(79,140,255,.65)}
.note{display:flex;gap:8px;align-items:center;padding:9px 13px;border-radius:11px;font-size:13px;margin-bottom:12px;background:rgba(79,140,255,.1);border:1px solid rgba(79,140,255,.3)}
.note.w{background:rgba(255,168,77,.1);border-color:rgba(255,168,77,.35)}.note.g{background:rgba(255,200,61,.1);border-color:rgba(255,200,61,.4)}
.tw{overflow-x:auto;margin:0 -6px;padding:0 6px 10px}
table{width:100%;border-collapse:separate;border-spacing:0 6px;min-width:560px}
th{font-size:11.5px;color:var(--mut);text-align:left;padding:4px 10px;font-weight:500;white-space:nowrap}
td{padding:10px;background:rgba(255,255,255,.04);vertical-align:middle;font-size:14px}
td:first-child{border-radius:12px 0 0 12px}td:last-child{border-radius:0 12px 12px 0}
.num{font:600 15px var(--hd);white-space:nowrap}.gap{color:var(--red)}
.lb td:first-child{width:54px;text-align:center;font:700 17px var(--hd)}
.rk3{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;font-size:19px}
.lb tr.lead td{background:linear-gradient(90deg,rgba(255,200,61,.17),rgba(255,200,61,.04));border-top:1px solid rgba(255,200,61,.55);border-bottom:1px solid rgba(255,200,61,.55)}
.lb tr.lead td:first-child{border-left:1px solid rgba(255,200,61,.55)}.lb tr.lead td:last-child{border-right:1px solid rgba(255,200,61,.55)}
.lb tr.me td{background:linear-gradient(90deg,rgba(46,230,166,.2),rgba(79,140,255,.1));border-top:1px solid rgba(46,230,166,.6);border-bottom:1px solid rgba(46,230,166,.6)}
.lb tr.me td:first-child{border-left:1px solid rgba(46,230,166,.6)}.lb tr.me td:last-child{border-right:1px solid rgba(46,230,166,.6)}
.pl{display:flex;align-items:center;gap:11px;min-width:150px}.pl img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--line)}
.lead .pl img{border-color:var(--gold);box-shadow:0 0 14px rgba(255,200,61,.6)}.me .pl img{border-color:var(--em)}
.pl b{display:block;font-size:14.5px}.pl small{font-size:12px}
.bar{position:relative;height:8px;border-radius:99px;background:rgba(255,255,255,.08);min-width:120px;margin-right:18px}
.bar i{display:block;height:100%;border-radius:99px;background:repeating-linear-gradient(90deg,var(--blue) 0 10px,var(--vio) 10px 20px);transition:width .7s}
.bar span{position:absolute;top:-9px;transform:translateX(-30%);font-size:17px;transition:left .7s}
.empty{text-align:center;padding:40px 16px 46px}.empty .big{font-size:44px;margin-bottom:8px}.empty b{font:600 19px var(--hd)}.empty p{color:var(--mut);margin-top:5px}
/* profile */
.banner{height:150px;border-radius:18px;position:relative;overflow:hidden;background:linear-gradient(120deg,#13224f,#4b2c9a 55%,#0f7a63)}
.banner:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 26px,rgba(255,255,255,.06) 26px 30px)}
.banner .bd{position:absolute;right:14px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap}
.pg{display:grid;grid-template-columns:290px 1fr;gap:18px;margin-top:-62px;padding:0 14px;align-items:start}
.idc{position:sticky;top:56px;padding:22px;text-align:center}
.avw{position:relative;width:120px;height:120px;margin:0 auto 12px}.avw img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--em);box-shadow:0 0 24px rgba(46,230,166,.45)}
.avedit{position:absolute;inset:0;border-radius:50%;border:0;background:rgba(0,0,0,.6);display:grid;place-items:center;font-size:26px;opacity:0;transition:opacity .2s;color:#fff}
.avw:hover .avedit,.avedit:focus-visible{opacity:1}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--em);box-shadow:0 0 9px var(--em);margin-right:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs button{border:1px solid var(--line);background:var(--glass);border-radius:99px;padding:8px 15px;color:var(--mut);font-weight:500}
.tabs .on{color:var(--txt);border-color:var(--blue);box-shadow:0 0 14px rgba(79,140,255,.4)}
.fl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.fld{padding:11px 13px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.fld label{display:flex;justify-content:space-between;margin-bottom:3px}.fld .val{font-weight:500;word-break:break-word;opacity:.92}
.lock{cursor:help;position:relative;font-size:12px}
.lock:hover:after,.lock:focus:after{content:attr(data-tip);position:absolute;right:0;bottom:130%;width:210px;padding:8px 10px;border-radius:9px;background:#1a1f3d;color:#eef1ff;border:1px solid var(--line);font-size:12px;z-index:5;line-height:1.35;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}.sh h3{margin:0}
.cn{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:11px;background:rgba(255,255,255,.04);margin-bottom:6px;font-size:13.5px}
/* trip */
.live{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;border-radius:16px;margin-bottom:14px;background:linear-gradient(90deg,rgba(46,230,166,.2),rgba(79,140,255,.1));border:1px solid rgba(46,230,166,.5)}
.live .pulse{width:12px;height:12px;border-radius:50%;background:var(--em);animation:pl 1.4s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(46,230,166,.7)}100%{box-shadow:0 0 0 14px rgba(46,230,166,0)}}
.live .tm{font:700 26px var(--hd);margin-left:auto}
.map{width:100%;height:320px;border-radius:14px;display:block;border:1px solid var(--line)}
.tg{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
.pf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tot{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;background:rgba(79,140,255,.12);border:1px solid rgba(79,140,255,.35);margin:12px 0;font:600 17px var(--hd)}
.pax{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);margin-bottom:8px}
/* champion */
.champ{text-align:center;padding:30px 18px;border-color:rgba(255,200,61,.6);background:radial-gradient(500px 260px at 50% 0,rgba(255,200,61,.2),transparent),var(--glass);box-shadow:0 0 50px rgba(255,200,61,.14)}
.champ .cw{position:relative;width:170px;height:170px;margin:30px auto 14px}.champ .cw img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:4px solid var(--gold);box-shadow:0 0 36px rgba(255,200,61,.7)}
.champ .cr{position:absolute;top:-34px;left:50%;transform:translateX(-50%);font-size:46px}
.champ h2{font-size:30px}.amt{font:700 34px var(--hd);color:var(--gold);margin:12px 0}
/* modal + toast */
.mod{position:fixed;inset:0;z-index:90;background:rgba(3,5,14,.7);backdrop-filter:blur(5px);display:grid;place-items:center;padding:16px;overflow:auto}
.mbox{width:min(560px,100%);padding:22px;max-height:92vh;overflow:auto;background:#12162e;border-radius:18px}[data-theme=light] .mbox{background:#fff}
.mbox h3{font-size:19px;margin-bottom:14px;display:flex;justify-content:space-between}.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0}.prs button{border:2px solid transparent;border-radius:50%;padding:0;background:none}.prs button.on{border-color:var(--em)}.prs img{width:100%;border-radius:50%;display:block}
.spin{width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp .7s linear infinite;display:inline-block}@keyframes sp{to{transform:rotate(1turn)}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;pointer-events:none;z-index:99;background:#14183a;color:#fff;border:1px solid var(--em);padding:12px 20px;border-radius:12px;transition:.3s;max-width:90vw;box-shadow:0 0 24px rgba(46,230,166,.3)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.act{display:flex;gap:5px;flex-wrap:wrap}
@media(max-width:880px){
#app{grid-template-columns:1fr;padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
#nav{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;z-index:60;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border:0;border-top:1px solid var(--line);overflow-x:auto;gap:2px;background:rgba(10,12,26,.88)}
[data-theme=light] #nav{background:rgba(255,255,255,.92)}
.brand{display:none}.ni{flex-direction:column;gap:2px;padding:6px 10px;font-size:11px;flex:1;min-width:64px;align-items:center;text-align:center;box-shadow:none!important}.ni.out{margin-top:0}.ni i{font-style:normal;font-size:18px}
#view{padding:54px 14px 14px}.pg,.tg{grid-template-columns:1fr}.idc{position:static}.hm{display:none}.map{height:260px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* messagerie, appels, assistant, navigation */
.hub{display:grid;grid-template-columns:300px 1fr;gap:14px;height:min(640px,calc(100vh - 240px));min-height:430px;margin-bottom:18px}
.cl{overflow:auto;padding:8px}
.ci{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:12px;border:1px solid transparent;background:none;text-align:left;color:var(--txt);margin-bottom:2px}
.ci:hover{background:var(--glass)}.ci.on{background:var(--glass2);border-color:var(--line)}
.ci img,.mini{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none}.mini{width:34px;height:34px}
.ci div{min-width:0;flex:1}.ci b{display:block;font-size:14px}.ci small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci em{background:var(--em);color:#04281c;font-style:normal;font-weight:700;font-size:11px;padding:1px 7px;border-radius:99px}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(79,140,255,.3),rgba(139,92,246,.3));font-size:19px;flex:none}
.cv{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ch{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line)}.ch img{width:40px;height:40px;border-radius:50%;object-fit:cover}.bk{display:none}
.ml{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.bb{max-width:80%;align-self:flex-start;display:flex;flex-direction:column;gap:3px}.bb.me{align-self:flex-end;align-items:flex-end}
.bt{padding:10px 14px;border-radius:16px 16px 16px 4px;background:rgba(255,255,255,.08);border:1px solid var(--line);word-break:break-word}
.bb.me .bt{border-radius:16px 16px 4px 16px;background:linear-gradient(135deg,#2f6bff,#6a3df0);border-color:transparent;color:#fff;box-shadow:0 0 18px rgba(79,140,255,.3)}
.who,.mt{color:var(--mut);font-size:11.5px}.tk{letter-spacing:-2px;font-size:12px}.tk.rd{color:#5fd0ff}
.rxs{display:flex;gap:6px}.rx{border:1px solid var(--line);background:var(--glass);border-radius:99px;padding:2px 10px;font-size:13px}.rx.on{border-color:var(--blue);background:rgba(79,140,255,.22)}
.cmp{display:flex;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}.cmp.rec{background:rgba(255,84,112,.12)}
.au{display:flex;align-items:center;gap:10px;min-width:min(250px,60vw)}.pb{width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.22);color:inherit;flex:none}
.wf{flex:1;display:flex;align-items:center;gap:2px;height:34px}.wf i{flex:1;min-width:2px;background:rgba(255,255,255,.35);border-radius:2px}.wf i.on{background:var(--em)}
.spd{border:1px solid rgba(255,255,255,.4);background:none;border-radius:99px;font-size:11px;padding:2px 7px;color:inherit}
.pd{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--em);box-shadow:0 0 7px var(--em);margin-right:6px}.pd.off{background:#6b7280;box-shadow:none}
.callbar{position:sticky;top:0;z-index:48;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 150px 9px 16px;background:linear-gradient(90deg,#0f6b4f,#1d3e8f);color:#fff;border-bottom:1px solid var(--line)}
.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:70;width:58px;height:58px;border-radius:50%;border:0;font-size:25px;background:linear-gradient(135deg,var(--em),var(--blue));box-shadow:0 0 28px rgba(46,230,166,.55);animation:fp 2.6s infinite}
@keyframes fp{0%,100%{box-shadow:0 0 0 0 rgba(46,230,166,.5)}50%{box-shadow:0 0 0 14px rgba(46,230,166,0)}}
.astp{position:fixed;right:16px;bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:70;width:min(380px,calc(100vw - 32px));max-height:72vh;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:14px;background:#12162e;border-radius:18px}
[data-theme=light] .astp,[data-theme=light] .mbox{background:#fff}
.ah{display:flex;align-items:center;gap:6px}.al{overflow:auto;max-height:200px;min-height:60px;display:flex;flex-direction:column;gap:7px}
.ab{padding:8px 12px;border-radius:13px;font-size:13.5px;max-width:90%}.ab.bot{background:rgba(255,255,255,.08);align-self:flex-start}.ab.me{background:linear-gradient(135deg,#2f6bff,#6a3df0);align-self:flex-end;color:#fff}.ab.live{opacity:.65}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:var(--glass);border-radius:99px;padding:4px 10px;font-size:12px}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;margin:0}.chk input{width:auto}.chk select{width:auto;padding:3px 6px}
.nvb{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;margin-bottom:10px;background:linear-gradient(90deg,#16408f,#2b2f8f);color:#fff}.nvb .ic{font-size:30px}.nvb div{flex:1}.nvb small{display:block;opacity:.8}
@media(max-width:880px){.hub{grid-template-columns:1fr;height:calc(100vh - 290px)}.hub.open .cl{display:none}.hub:not(.open) .cv{display:none}.bk{display:inline-flex}.fab{bottom:calc(84px + env(safe-area-inset-bottom,0px))}.astp{bottom:calc(152px + env(safe-area-inset-bottom,0px))}.tg[style]{grid-template-columns:1fr!important}}
.lvl{height:8px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}.lvl i{display:block;height:100%;width:0;background:var(--em);transition:width .1s}.stat{font-size:12.5px;color:var(--mut)}
/* mode clair : compléments */
[data-theme=light] td,[data-theme=light] .fld,[data-theme=light] .cn,[data-theme=light] .pax,[data-theme=light] .ab.bot{background:rgba(20,30,70,.05)}
[data-theme=light] .pills,[data-theme=light] .seg{background:rgba(20,30,70,.06)}
[data-theme=light] .bar,[data-theme=light] .lvl{background:rgba(20,30,70,.12)}
[data-theme=light] .bt{background:rgba(20,30,70,.06)}
[data-theme=light] .bt .wf i{background:rgba(20,30,70,.3)}[data-theme=light] .bb.me .bt .wf i{background:rgba(255,255,255,.45)}[data-theme=light] .bt .wf i.on{background:var(--em)}
[data-theme=light] .bt .pb{background:rgba(20,30,70,.12)}[data-theme=light] .bb.me .bt .pb{background:rgba(255,255,255,.25)}
[data-theme=light] .lb tr.me td{background:linear-gradient(90deg,rgba(46,230,166,.28),rgba(79,140,255,.12))}
[data-theme=light] .lb tr.lead td{background:linear-gradient(90deg,rgba(255,200,61,.32),rgba(255,200,61,.08))}
[data-theme=light] .tbtn{box-shadow:0 4px 14px rgba(20,30,70,.15)}
</style>
</head>
<body>
<div id="demo" class="tools"></div>
<div id="callbar" class="callbar" hidden></div>

<section id="login" hidden>
 <div class="lcard glass">
  <div class="logo">G5</div>
  <h1>Championnat G5</h1>
  <p class="mut" id="lsub">Connectez-vous pour accéder à votre espace.</p>
  <div class="seg" id="sg"><button data-act="ltab" data-v="rider" class="on">Motard</button><button data-act="ltab" data-v="admin">Administrateur</button></div>
  <form id="lf">
   <div class="fg"><label id="l1">Identifiant motard</label><input id="lu" placeholder="Identifiant" autocomplete="username" required></div>
   <div class="fg"><label>Mot de passe</label><input id="lp" type="password" placeholder="••••" autocomplete="current-password" required></div>
   <div class="err" id="le"></div>
   <button class="btn big" type="submit">Se connecter</button>
  </form>
  <form id="sf" hidden><div class="fg" style="margin-top:16px"><label>Identifiant administrateur (ex : ADMIN)</label><input id="si" autocomplete="username" required></div><div class="fg"><label>Téléphone</label><input id="sph" type="tel" placeholder="+243 …"></div><div class="fg"><label>E-mail (facultatif)</label><input id="sm" type="email"></div><div class="fg"><label>Mot de passe (8 caractères min.)</label><input id="sp" type="password" autocomplete="new-password" required></div><div class="fg"><label>Confirmer le mot de passe</label><input id="sp2" type="password" autocomplete="new-password" required></div><div class="err" id="se"></div><button class="btn big" type="submit">Créer le compte administrateur</button></form>
 </div>
</section>

<div id="app" hidden><aside id="nav"></aside><main id="view"></main></div>
<div id="modal" class="mod" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<button id="fab" class="fab" data-act="ast" aria-label="Assistant vocal" hidden>🎙️</button>
<div id="ast" class="astp glass" hidden></div>

<script>
const KEY='G5_PROD_V1',DAY=864e5;
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('fr-FR').format(Math.round(n||0))+' FC';
const tm=t=>new Date(t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
const dt=t=>new Date(t).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})+' '+tm(t);
const hms=ms=>{const s=Math.floor(ms/1e3);return [s/3600|0,(s/60|0)%60,s%60].map(v=>String(v).padStart(2,'0')).join(':')};
async function H(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('g5|'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return 'p:'+p}}
const devName=()=>/Android/i.test(navigator.userAgent)?'Android':/iPhone|iPad/i.test(navigator.userAgent)?'iOS':'Navigateur';
function dl(n,c,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:m+';charset=utf-8'}));a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},600)}
const csv=rows=>'\ufeff'+rows.map(r=>r.map(v=>typeof v==='number'?v:'"'+String(v??'').replace(/^([=+\-@])/,"'$1").replace(/"/g,'""')+'"').join(';')).join('\r\n');
let S,PAGE,PER='cycle',PT='info',LR='rider',CB=null,AVM={},UPH=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){if(!save.w){save.w=1;setTimeout(()=>{save.w=0},6000);try{toast("⚠️ Stockage de l'appareil plein ou bloqué : exportez une sauvegarde (Réglages).")}catch(_){}}}};
const midnight=(t=Date.now())=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};

/* ---------- données ---------- */
function seed(){return{admin:null,riders:[],rec:[],nextRec:1,comp:{startAt:null,days:30,frozen:null,paused:false,ended:false},trip:null,sess:null,theme:'dark',lastAmt:500,zones:[],log:[]}}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||!S.riders)S=seed();ext(S);S.offline=false;document.documentElement.dataset.theme=S.theme||'dark'}
const log=(act,flag)=>{S.log.unshift({ts:Date.now(),who:S.sess?(S.sess.role==='admin'?'ADMIN':S.sess.id):'SYSTÈME',act,flag:flag?1:0});S.log=S.log.slice(0,120)};

/* ---------- avatars ---------- */
const svgUri=s=>'data:image/svg+xml,'+encodeURIComponent(s);
function av(r){if(r.photo)return r.photo;const h=[...r.id].reduce((a,c)=>a+c.charCodeAt(0)*7,0)%360;
 return svgUri(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='hsl(${h} 80% 55%)'/><stop offset='1' stop-color='hsl(${(h+60)%360} 80% 32%)'/></linearGradient></defs><rect width='64' height='64' fill='url(#g)'/><text x='32' y='42' font-size='26' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='white'>${esc(r.first[0]+r.name[0]).toUpperCase()}</text></svg>`)}
const PRS=['🏍️','🦁','🦅','⚡','🔥','🐺'];
const prs=i=>svgUri(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='hsl(${i*55+200} 75% 50%)'/><stop offset='1' stop-color='hsl(${i*55+260} 75% 28%)'/></linearGradient></defs><rect width='64' height='64' fill='url(#g)'/><text x='32' y='43' font-size='30' text-anchor='middle'>${PRS[i]}</text></svg>`);
function sq(img,size,z){const c=document.createElement('canvas');c.width=c.height=size;const s=Math.min(img.width,img.height)/z;c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size);return c.toDataURL('image/jpeg',.85)}
function readImg(f,cb){if(!f)return;if(!/image\/(jpeg|png)/.test(f.type)){toast('Format non pris en charge. Choisissez un fichier JPG ou PNG.');return}const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>cb(i);i.src=r.result};r.readAsDataURL(f)}

/* ---------- état de la compétition & classement ---------- */
const me=()=>S.riders.find(r=>r.id===S.sess.id);
const rd=id=>S.riders.find(r=>r.id===id)||{id,first:'?',name:'Inconnu'};
const full=r=>`${r.first} ${r.name}`;
function compState(){const c=S.comp;if(!c.startAt)return'idle';if(c.ended||Date.now()>c.startAt+c.days*DAY)return'ended';return c.paused?'paused':'live'}
function limit(){const c=S.comp;if(c.frozen)return c.frozen;const e=c.startAt+c.days*DAY;return c.startAt&&Date.now()>e?e:0}
function board(per){if(S.sess&&S.sess.role==='rider'&&!online()&&S.snap&&S.snap[per])return S.snap[per].map(x=>({...x,r:rd(x.id)}));return calc(per)}
function calc(per){const c=S.comp;if(!c.startAt)return[];const L=limit(),ref=L||Date.now();
 const from=Math.max(c.startAt,per==='day'?midnight(ref):per==='week'?ref-7*DAY:0);
 const rows=S.riders.filter(r=>r.status!=='Banni').map(r=>{const k=S.rec.filter(x=>x.rid===r.id&&x.st==='ok'&&x.ts>=from&&(!L||x.vat<=L));return{r,amt:k.reduce((a,x)=>a+x.val,0),n:k.length,pax:k.reduce((a,x)=>a+x.pax,0)}}).sort((a,b)=>b.amt-a.amt||a.r.id.localeCompare(b.r.id));
 rows.forEach((x,i)=>{x.rk=i+1;x.gap=i?rows[i-1].amt-x.amt:0});return rows}
const dayNo=()=>{const c=S.comp;return Math.min(c.days,Math.floor(((limit()||Date.now())-c.startAt)/DAY)+1)};
function lbHTML(meId){
 const st=compState(),c=S.comp;
 let h=`<div class="glass lbc"><div class="lbh"><h2>🏁 Classement &amp; suivi des performances</h2><div class="pills" role="tablist">${[['day','Jour'],['week','Semaine'],['cycle','Cycle · '+c.days+' j']].map(([k,l])=>`<button class="pill ${PER===k?'on':''}" data-act="per" data-v="${k}" role="tab" aria-selected="${PER===k}">${l}</button>`).join('')}</div></div>`;
 if(st==='idle')return h+`<div class="empty"><div class="big">🏁</div><b>Le championnat n'a pas encore commencé.</b><p>Restez connectés !</p></div></div>`;
 h+=st==='paused'?`<div class="note w">⏸ Compétition en pause : le classement est figé jusqu'à la reprise.</div>`:st==='ended'?`<div class="note g">🏁 Cycle terminé : classement final figé.</div>`:`<div class="note">🟢 Jour ${dayNo()} sur ${c.days}. Seuls les montants validés par l'administration apparaissent ici.</div>`;
 if(S.sess&&S.sess.role==='rider'&&!online())h+=`<div class="note w">📴 Hors-ligne : dernier classement connu${S.snap?' ('+tm(S.snap.at)+')':''}. Mise à jour automatique au retour du réseau.</div>`;const rows=board(PER),top=rows[0]?rows[0].amt:0;if(!rows.length)return h+'<div class="empty"><div class="big">🏍️</div><b>Aucun participant pour le moment.</b><p>Les motards inscrits apparaîtront ici.</p></div></div>';
 h+=`<div class="tw"><table class="lb"><thead><tr><th>Rang</th><th>Participant</th><th class="hm">Piste</th><th class="hm">Courses</th><th>Recette</th><th>Écart</th><th>Statut</th></tr></thead><tbody>`;
 rows.forEach(x=>{const lead=x.rk==1&&x.amt>0,mine=x.r.id===meId,w=top?x.amt/top*100:0;
  const medal=lead?'<span class="rk3">👑</span>':x.rk==2&&x.amt?'<span class="rk3">🥈</span>':x.rk==3&&x.amt?'<span class="rk3">🥉</span>':x.rk;
  const tags=(lead?'<span class="badge b-gold">LEADER</span> ':'')+(mine?'<span class="badge b-em">VOUS</span>':'')+(!lead&&!mine?(x.r.status==='En pause'?'<span class="badge b-amb">PAUSE</span>':'<span class="badge b-blue">ACTIF</span>'):'');
  h+=`<tr class="${lead?'lead':''} ${mine?'me':''}"><td>${medal}</td><td><div class="pl"><img src="${av(x.r)}" alt=""><div><b>${esc(full(x.r))}</b><small>${x.r.id} · ${esc(x.r.moto)}</small></div></div></td><td class="hm"><div class="bar"><i style="width:${w}%"></i><span style="left:${w}%">🏍️</span></div></td><td class="hm">${x.n} · ${x.pax} pers.</td><td class="num">${money(x.amt)}</td><td class="num gap">${x.rk==1?'—':'-'+money(x.gap)}</td><td>${tags}</td></tr>`});
 return h+`</tbody></table></div></div>`}

/* ---------- pages motard ---------- */
const V={};
V.dash=()=>{const r=me(),st=compState(),b=board('cycle'),mine=b.find(x=>x.r.id===r.id),today=midnight();
 const pend=S.rec.filter(x=>x.rid===r.id&&x.st==='wait');
 return`<div class="ph"><div><h1>Bonjour ${esc(r.first)} 👋</h1><p>Voici l'état du championnat et de vos résultats.</p></div></div>${lbHTML(r.id)}
 <div style="height:18px"></div><div class="grid g4">
 <div class="glass kpi em"><small>Ma recette validée (cycle)</small><div class="v">${st==='idle'?'—':money(mine?mine.amt:0)}</div><div class="s">Publiée par l'administration</div></div>
 <div class="glass kpi amb"><small>En attente de validation</small><div class="v">${money(pend.reduce((a,x)=>a+x.amount,0))}</div><div class="s">${pend.length} trajet(s) à valider · non classé</div></div>
 <div class="glass kpi blue"><small>Ma position</small><div class="v">${st==='idle'||!mine?'—':'#'+mine.rk+' / '+b.length}</div><div class="s">${mine&&mine.rk>1?'Retard : '+money(mine.gap):'Cycle en cours'}</div></div>
 <div class="glass kpi gold"><small>Trajets aujourd'hui</small><div class="v">${S.rec.filter(x=>x.rid===r.id&&x.ts>=today).length}</div><div class="s">Tous statuts confondus</div></div></div>`};
const stB=s=>s==='ok'?'<span class="badge b-em">Validée</span>':s==='no'?'<span class="badge b-red">Rejetée</span>':'<span class="badge b-amb">En attente</span>';
V.trip=()=>{const t=S.trip,r=me();
 const hist=S.rec.filter(x=>x.rid===r.id).sort((a,b)=>b.ts-a.ts).slice(0,6);
 const histH=`<div class="glass card"><h3>Mes derniers trajets</h3>${hist.length?hist.map(x=>`<div class="cn"><span>${dt(x.ts)} · ${x.km==null?'déclaration':x.pax+' pers.'}</span><span><b>${money(x.amount)}</b> ${stB(x.st)}${x.sync===false?' <span class="badge b-amb">🕓 À synchroniser</span>':''}</span></div>`).join(''):'<p class="mut">Aucun trajet pour le moment.</p>'}</div>`;
 const decl=`<div class="glass card"><h3>🎙️ Saisie vocale de la journée</h3><p class="mut" style="font-size:13px;margin-bottom:10px">Dictez : « Aujourd'hui j'ai fait 12 courses, 45 000 francs, carburant 5000 francs, avenue Kasa-Vubu ».</p><button class="btn em" data-act="decl">🎙️ Dicter ma journée</button></div>`;
 const mapc='';
 if(!t)return`<div class="ph"><div><h1>Mon trajet</h1><p>Démarrez un trajet pour activer le suivi GPS et la saisie des passagers.</p></div></div>
 <div class="glass card" style="text-align:center;padding:36px 18px"><div style="font-size:50px">🏍️</div><h3 style="margin:10px 0 6px">Prêt à rouler ?</h3><p class="mut" style="margin-bottom:18px">Votre position est suivie en temps réel, même sans connexion.</p><button class="btn em big" style="max-width:340px" data-act="tstart">▶ Démarrer le trajet</button></div><div class="grid g2">${decl}${mapc}</div>${histH}`;
 const ab=t.groups.filter(g=>!g.drop),done=t.groups.filter(g=>g.drop),rev=sumd(done,g=>g.n*g.amt),L=t.pts[t.pts.length-1];
 const zl=`<div class="glass card"><h3>🔥 Zones à forte demande</h3>${S.zones.length?S.zones.map(z=>{const d=L?Math.round(dist(L,z)):null;return`<div class="cn"><span><b>${esc(z.n)}</b> <span class="badge ${z.d==='forte'?'b-red':z.d==='moyenne'?'b-amb':'b-blue'}">${z.d}</span><br><small>${d==null?'—':d+' m'}</small></span><button class="btn sm ghost" data-act="dest" data-v="${esc(z.k)}">🧭 Y aller</button></div>`}).join(''):'<p class="mut" style="font-size:13px">Aucune zone définie par l\'administration.</p>'}</div>`;
 return`<div class="ph"><div><h1>Mon trajet</h1></div></div>
 <div class="live"><span class="pulse"></span><b class="hd" style="font-size:18px">🟢 TRAJET EN COURS</b><span class="badge" id="gl">📡 GPS : …</span>${online()?'':'<span class="badge b-amb">📴 Hors-ligne : tracé enregistré sur l\'appareil</span>'}<span class="tm" id="tmr">00:00:00</span></div>
 <div class="tg"><div><div class="glass card"><h3>📍 Position en temps réel</h3><div class="nvb" id="nv" hidden></div><canvas id="map" class="map"></canvas>
  <div class="grid" style="margin-top:12px;grid-template-columns:repeat(3,1fr)"><div class="glass kpi"><small>Distance</small><div class="v" id="kms">0 km</div></div><div class="glass kpi"><small>Vitesse</small><div class="v" id="spd">0 km/h</div></div><div class="glass kpi em"><small>Recette du trajet</small><div class="v">${money(rev)}</div></div></div>
  <p class="mut" style="font-size:12px;margin-top:10px">Le suivi utilise le GPS de l'appareil : autorisez la localisation dans le navigateur.</p></div>${zl}</div>
 <div><div class="glass card"><h3>➕ Prendre une personne</h3>
  <div class="pf"><div><label>Nombre de personnes</label><input id="pn" type="number" min="1" max="4" value="1" data-in="calc"></div><div><label>Montant par personne (FC)</label><input id="pa" type="number" min="0" step="500" value="${S.lastAmt||500}" data-in="calc"></div></div>
  <div class="tot"><span>Total</span><span id="tot">${money(S.lastAmt||500)}</span></div>
  <button class="btn big" data-act="take">➕ Ajouter / Prendre une personne</button></div>
 <div class="glass card"><h3>À bord (${sumd(ab,g=>g.n)})</h3>${ab.length?ab.map(g=>`<div class="pax"><span><b>${g.n} pers.</b> × ${money(g.amt)}<br><small>Prise à ${tm(g.at)}</small></span><span><b>${money(g.n*g.amt)}</b> <button class="btn sm em" data-act="drop" data-v="${g.id}">📍 Déposer</button></span></div>`).join(''):'<p class="mut">Personne à bord.</p>'}
  ${done.length?`<small>Déjà déposés : ${sumd(done,g=>g.n)} pers. · ${money(rev)}</small>`:''}
  <button class="btn red big" style="margin-top:14px" data-act="tend">🛑 Terminer le trajet</button></div>${decl}</div></div>${histH}`};
V.champ=()=>{const st=compState();if(st==='idle')return`<div class="ph"><div><h1>Champion</h1></div></div><div class="glass card empty"><div class="big">🏆</div><b>Le championnat n'a pas encore commencé.</b><p>Restez connectés !</p></div>`;
 const b=board('cycle'),w=b[0];if(!w||!w.amt)return`<div class="ph"><div><h1>Champion</h1></div></div><div class="glass card empty"><div class="big">🏆</div><b>Aucune recette validée pour le moment.</b></div>`;
 const r=w.r,fin=st==='ended',fl=(l,v)=>`<div class="fld" style="text-align:left"><label>${l}</label><div class="val">${esc(v)}</div></div>`;
 return`<div class="ph"><div><h1>Champion</h1><p>${fin?'Le vainqueur du cycle est proclamé.':'Leader provisoire : le champion sera proclamé à la fin du cycle.'}</p></div></div>
 <div class="glass champ"><span class="badge b-gold">${fin?'🏆 CHAMPION DU CYCLE':'👑 LEADER PROVISOIRE'}</span><div class="cw"><span class="cr">👑</span><img src="${av(r)}" alt="Photo de ${esc(full(r))}"></div>
 <h2>${esc(full(r))}</h2><p class="mut">${r.id} · ${esc(r.role)}</p><div class="amt">${money(w.amt)}</div><p class="mut">${w.n} courses validées · ${w.pax} passagers</p>
